<!DOCTYPE html>
<html>
<body style="background:black;color:white;font-family:sans-serif">
<div id="data">Loading...</div>

<script>
async function load() {
  try {
    // Use a CORS/HTTPS proxy so GitHub Pages can fetch your HTTP server
    const res = await fetch("https://cors-anywhere.herokuapp.com/http://185.83.152.104");
    const data = await res.json();
    document.getElementById("data").innerHTML = `
      🌍 Time: ${data.Time}<br>
      🌦 Weather: ${data.Weather}<br>
      📍 Aerostat: ${data.Aerostat}
    `;
  } catch (err) {
    document.getElementById("data").innerHTML = "Error loading data";
    console.error(err);
  }
}

// Refresh every second
setInterval(load, 1000);
load();
</script>
</body>
</html>
