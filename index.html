<!DOCTYPE html>
<html>
  <body style="background:black;color:white;font-family:sans-serif">
    <div id="data">Loading...</div>

    <script>
      async function load() {
        try {
          // Use your own Vercel proxy
          const res = await fetch("https://mlm-indol.vercel.app/api/proxy");
          const data = await res.json();

          document.getElementById("data").innerHTML = `
            🌍 Time: ${data.Time}<br>
            🌦 Weather: ${data.Weather}<br>
            📍 Aerostat: ${data.Aerostat}
          `;
        } catch (err) {
          document.getElementById("data").innerHTML = "Error loading data";
          console.error(err);
        }
      }

      // Update every second
      setInterval(load, 1000);
      load();
    </script>
  </body>
</html>
