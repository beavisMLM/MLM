<!DOCTYPE html>
<html>
<body style="background:black;color:white;font-family:sans-serif">
<div id="data">Loading...</div>

<script>
const data = {
  Time: "14:30",
  Weather: "Sunny",
  Aerostat: "Active"
};

function updateDisplay() {
  document.getElementById("data").innerHTML = `
    🌍 Time: ${data.Time}<br>
    🌦 Weather: ${data.Weather}<br>
    📍 Aerostat: ${data.Aerostat}
  `;
}

// Update every second if you want it to refresh
setInterval(updateDisplay, 1000);
updateDisplay();
</script>
</body>
</html>
